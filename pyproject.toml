[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "professorx-study"
version = "0.6.2b1"
description = "Public ProfessorX student skill and limited teaching-plan MCP client"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["mcp>=1.28,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
professorx-mcp = "professorx.mcp_bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
